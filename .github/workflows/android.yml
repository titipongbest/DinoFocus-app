name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the version number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: echo "APP_VERSION=1.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DINOFOCUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > dinofocus-release.jks
            echo "Signing with dinofocus-release.jks"
          else
            echo "::warning::DINOFOCUS_KEYSTORE_BASE64 secret not set - APK is signed with the debug key"
          fi

      - name: Build release APK
        env:
          DINOFOCUS_PASSWORD: ${{ secrets.DINOFOCUS_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name APK with version
        run: |
          mkdir -p out
          mv app/build/outputs/apk/release/app-release.apk "out/DinoFocus-v${APP_VERSION}.apk"
          rm -f dinofocus-release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoFocus-v${{ env.APP_VERSION }}
          path: out/*.apk
          if-no-files-found: error
