name: Android build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets a version tag publish a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the version number is the commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: echo "APP_VERSION=1.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DINOFOCUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > dinofocus-release.jks
            echo "Signing with dinofocus-release.jks"
          else
            echo "::warning::DINOFOCUS_KEYSTORE_BASE64 secret not set - APK is signed with the debug key"
          fi

      - name: Sync tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          DINOFOCUS_PASSWORD: ${{ secrets.DINOFOCUS_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Name APK with version
        run: |
          mkdir -p out
          mv app/build/outputs/apk/release/app-release.apk "out/DinoFocus-v${APP_VERSION}.apk"
          rm -f dinofocus-release.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoFocus-v${{ env.APP_VERSION }}
          path: out/*.apk
          if-no-files-found: error

      # A release is published for a version tag, or for a push to main whose commit message has "[release]"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: DinoFocus v${{ env.APP_VERSION }}
          make_latest: true
          files: out/*.apk
          body: |
            DinoFocus v${{ env.APP_VERSION }} · by NorthXbar

            ติดตั้ง: ดาวน์โหลดไฟล์ .apk ด้านล่างบนมือถือ แล้วเปิดติดตั้ง (อนุญาตติดตั้งจากแหล่งที่ไม่รู้จักถ้าระบบถาม)
            ติดตั้งทับเวอร์ชันก่อนหน้าได้ ข้อมูลไม่หาย
